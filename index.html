<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benny Yuan</title>
    <meta name="description" content="Benny Yuan's personal website. Blow the grass aside to find him." />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1407; overflow: hidden; touch-action: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .fallback { width: 100%; height: 100%; object-fit: cover; }
      .capture-status { position: fixed; left: 16px; bottom: 16px; margin: 0; color: #cfe8a0; font: 12px/1.4 ui-monospace, monospace; }
      .presets { position: fixed; z-index: 3; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: calc(100vw - 32px); font: 12px/1.3 ui-monospace, Menlo, monospace; color: #e8efd8; }
      .presets button { display: flex; align-items: center; gap: 7px; padding: 7px 11px 7px 8px; border: 1px solid #ffffff2e; border-radius: 6px; background: #0a1208c4; color: inherit; font: inherit; cursor: pointer; backdrop-filter: blur(6px); }
      .presets button:hover { background: #18261ad0; }
      .presets button[aria-pressed='true'] { background: #e8efd8; color: #10180c; border-color: #e8efd8; }
      .presets kbd { font: inherit; opacity: 0.6; }
      .presets p { flex-basis: 100%; margin: 2px 0 0; padding: 5px 9px; width: fit-content; border-radius: 6px; background: #0a1208c4; backdrop-filter: blur(6px); }
      .error { position: fixed; inset: auto 16px 16px 16px; color: #f88; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main id="ground"></main>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="notes"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
